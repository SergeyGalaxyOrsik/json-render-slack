name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch upstream changes when the pinned versions are bumped by hand.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bun test
